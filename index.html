<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rough Demo Store</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 20px;
            position: relative;
        }
        .page {
            border: 2px solid #000;
            padding: 10px;
            max-width: 800px;
            margin: 0 auto;
            min-height: 400px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #000;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .nav-icons {
            min-width: 50px; 
        }
        .nav-icons span {
            cursor: pointer;
            margin: 0 5px;
            font-size: 20px;
        }
        .promo-banner {
            border: 1px solid #000;
            padding: 5px;
            cursor: pointer;
        }
        
        #right-menu {
            display: none; 
            position: absolute;
            top: 70px;
            right: 30px; 
            width: 150px;
            background-color: white;
            border: 2px solid #000;
            box-shadow: -4px 4px 0px rgba(0,0,0,0.1);
            z-index: 100;
        }
        #right-menu ul {
            list-style-type: none;
            padding: 0;
            margin: 0;
        }
        #right-menu li {
            padding: 10px;
            border-bottom: 1px solid #000;
            cursor: pointer;
        }
        #right-menu li:last-child { border-bottom: none; }
        #right-menu li:hover { background: #eee; }

        .sale-circle {
            border: 3px solid #000;
            border-radius: 50%; 
            width: 250px;
            height: 250px;
            margin: 40px auto; 
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            cursor: pointer;
            padding: 20px;
            box-sizing: border-box;
            transition: background 0.2s; 
        }
        .sale-circle:hover {
            background-color: #f0f0f0;
        }
        
        .catalog-container {
            display: flex;
            gap: 20px;
        }
        .sidebar {
            width: 150px;
            border-right: 2px solid #000;
            padding-right: 10px;
        }
        .product-grid {
            display: flex;
            gap: 10px;
        }
        .product-card {
            border: 2px solid #000;
            padding: 10px;
            width: 120px;
            text-align: center;
        }
        .product-image {
            width: 100%;
            height: 80px;
            border: 1px solid red; 
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .price { color: red; font-weight: bold; }
        button { cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <div id="right-menu">
        <ul>
            <li onclick="goToCatalog(); toggleMenu()" tabindex="0">Womens ></li>
            <li onclick="goToCatalog(); toggleMenu()" tabindex="0">Mens ></li>
            <li onclick="goToCatalog(); toggleMenu()" tabindex="0">Kids ></li>
            <li onclick="goToCatalog(); toggleMenu()" tabindex="0">Sale ></li>
            <li onclick="goToCatalog(); toggleMenu()" tabindex="0">Spring Sale ></li>
        </ul>
    </div>

    <div id="home-page" class="page">
        <header>
            <div class="nav-icons"></div>
            <div class="promo-banner" onclick="alert('Account creation process started!')" tabindex="0">
                click to create an account for 15% off
            </div>
            <div class="nav-icons">
                <span title="Search">🔍</span>
                <span title="Menu" onclick="toggleMenu()" tabindex="0">☰</span>
            </div>
        </header>

        <h1 class="sale-circle" onclick="goToCatalog()" tabindex="0" title="Go to Catalog">
            Check Out Our Spring Sale!
        </h1>
    </div>

    <div id="catalog-page" class="page" style="display: none;">
        <header>
            <div class="nav-icons"></div>
            <div class="nav-links">
                <span style="color: red; margin: 0 10px;">Men</span>
                <span style="color: red; margin: 0 10px;">Women</span>
                <span style="color: red; margin: 0 10px;">Kids</span>
                <button onclick="goHome()" style="border: 2px solid red; color: red; background: none;">home</button>
            </div>
            <div class="nav-icons">
                <span style="color: red;" title="Search">🔍</span>
                <span style="color: red;" title="Menu" onclick="toggleMenu()" tabindex="0">☰</span>
            </div>
        </header>

        <div class="catalog-container">
            <div class="sidebar">
                <label><input type="checkbox" class="filter-cb"> Small</label><br><br>
                <label><input type="checkbox" class="filter-cb"> Medium</label><br><br>
                <label><input type="checkbox" class="filter-cb"> Large</label><br><br>
                <button onclick="clearFilters()">Clear Filters</button><br><br>
                <label><input type="checkbox" class="filter-cb"> Sale</label>
            </div>

            <div class="product-grid">
                <div class="product-card">
                    <div class="product-image">👔</div>
                    <div>Brown Striped Shirt</div>
                    <div class="price">25$</div>
                </div>
                <div class="product-card">
                    <div class="product-image">🩳</div>
                    <div>Green Cargo Shorts</div>
                    <div class="price">20$</div>
                </div>
                <div class="product-card">
                    <div class="product-image">👖</div>
                    <div>Baggy Jeans</div>
                    <div class="price">40$</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const homePage = document.getElementById('home-page');
        const catalogPage = document.getElementById('catalog-page');
        const checkboxes = document.querySelectorAll('.filter-cb');
        const rightMenu = document.getElementById('right-menu');

        function toggleMenu() {
            if (rightMenu.style.display === 'block') {
                rightMenu.style.display = 'none';
            } else {
                rightMenu.style.display = 'block';
            }
        }

        function goToCatalog() {
            homePage.style.display = 'none';
            catalogPage.style.display = 'block';
        }

        function goHome() {
            catalogPage.style.display = 'none';
            homePage.style.display = 'block';
            rightMenu.style.display = 'none'; 
        }

        function clearFilters() {
            checkboxes.forEach(cb => cb.checked = false);
            alert('Filters cleared!'); 
        }
    </script>
</body>
</html>
